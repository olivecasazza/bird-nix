name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  checks: write

# Nix evaluation tests and the pages build are flake `checks`, built by
# buildbot-nix on PRs; GitHub Actions runs no Nix. The playground tests below
# are plain cargo.
jobs:
  playground-tests:
    name: Playground (tvix) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run cargo tests
        id: cargo-test
        working-directory: playground
        run: |
          set +e
          cargo nextest run --profile ci 2>&1 | tee cargo-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write summary
        if: always()
        working-directory: playground
        run: |
          # nextest output: "N tests run: M passed, F failed, S skipped"
          # Fall back to counting PASS/FAIL lines
          passed=$(grep -cE '^\s+PASS' cargo-output.txt 2>/dev/null || echo 0)
          failed=$(grep -cE '^\s+FAIL' cargo-output.txt 2>/dev/null || echo 0)
          total=$((passed + failed))

          if [ "$failed" -eq 0 ]; then
            badge="✅"
          else
            badge="❌"
          fi

          {
            echo "## ${badge} Playground (tvix) Tests"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Total  | ${total} |"
            echo "| Passed | ${passed} |"
            echo "| Failed | ${failed} |"
            echo ""
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat cargo-output.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-test-results
          path: |
            playground/target/nextest/ci/junit.xml
            playground/cargo-output.txt
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: playground/target/nextest/ci/junit.xml
          check_name: Playground Tests
          include_passed: true
          require_passed_tests: false

      - name: Fail if tests failed
        if: steps.cargo-test.outputs.exit_code != '0'
        run: exit 1
